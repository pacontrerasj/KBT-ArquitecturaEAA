apiVersion: v1
kind: Service
metadata:
  name: get-products
  namespace: escolaronline
  labels:
    app: get-products
    version: v1
    tier: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    description: "Internal service for get-products microservice"
spec:
  type: ClusterIP
  
  selector:
    app: get-products
  
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP
  
  clusterIP: None  # Headless service for pod-to-pod communication
