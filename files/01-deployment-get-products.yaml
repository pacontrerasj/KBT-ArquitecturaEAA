apiVersion: apps/v1
kind: Deployment
metadata:
  name: get-products
  namespace: escolaronline
  labels:
    app: get-products
    version: v1
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: get-products
  template:
    metadata:
      labels:
        app: get-products
        version: v1
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: get-products
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - get-products
              topologyKey: kubernetes.io/hostname
      
      containers:
      - name: get-products
        image: 123456789.dkr.ecr.us-east-1.amazonaws.com/get-products:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 3001
          protocol: TCP
        
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: host
        
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: username
        
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: password
        
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: database-name
        
        - name: NODE_ENV
          value: "production"
        
        - name: LOG_LEVEL
          value: "info"
        
        - name: SERVICE_NAME
          value: "get-products"
        
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir:
          sizeLimit: 100Mi
      
      terminationGracePeriodSeconds: 30
