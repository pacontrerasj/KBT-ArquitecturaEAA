---
# ConfigMap for MySQL configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: escolaronline
  labels:
    app: get-products
    component: database
data:
  database-name: "escolaronline_db"
  database-port: "3306"
  
  # RDS Endpoint for Multi-AZ
  # Primary endpoint (AZ1a): rds-primary.abc123.us-east-1.rds.amazonaws.com
  # Reader endpoint (load-balanced): rds-reader.abc123.us-east-1.rds.amazonaws.com
  # Writer endpoint: rds-writer.abc123.us-east-1.rds.amazonaws.com

---
# Secret for MySQL credentials
# NOTE: In production, use AWS Secrets Manager with SecretStore
# Install External Secrets Operator: https://external-secrets.io/
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: escolaronline
  labels:
    app: get-products
    component: database
type: Opaque
stringData:
  # ⚠️  IMPORTANT: Replace with actual RDS endpoint
  host: "rds-cluster.cluster-abc123.us-east-1.rds.amazonaws.com"
  
  # ⚠️  IMPORTANT: Replace with actual database username
  username: "admin"
  
  # ⚠️  IMPORTANT: Replace with actual secure password
  # In production, use: AWS Secrets Manager + External Secrets Operator
  password: "SecurePassword123!"
  
  port: "3306"
  ssl: "true"

---
# Secret for ECR credentials (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: ecr-credentials
  namespace: escolaronline
  labels:
    app: get-products
type: kubernetes.io/dockercfg
dockercfg: |
  {
    "123456789.dkr.ecr.us-east-1.amazonaws.com": {
      "username": "AWS",
      "password": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
      "email": "none"
    }
  }

---
# Pod Priority Class for critical workloads
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 1000
globalDefault: false
description: "Priority class for critical backend services"
